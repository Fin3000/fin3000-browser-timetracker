workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - verify

verify-extension:
  stage: verify
  image: node:22.22.3-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - apk add --no-cache zip chromium
    - export FIN3000_CHROMIUM=/usr/bin/chromium-browser
    - npm ci --cache .npm --prefer-offline
    - npm run typecheck
    - QA_SLUG=timer-ci npm test
    - QA_SLUG=timer-ci npm run timer-extension:repro:qa
    - npm run repro
    - npm run build
  artifacts:
    paths:
      - dist/timer-extension/production/*.xpi
    expire_in: 1 week
  # Native Firefox installation/restart QA runs separately with disposable profiles.
